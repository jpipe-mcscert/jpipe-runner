# Dependency freshness (ADR-0026, after jpipe-vscode ADR-VSC-0013): weekly, grouped.
#
# Every entry sets `labels:`, which replaces Dependabot's defaults. Without it, a file with more
# than one ecosystem also gets a per-ecosystem label (`python`, `github_actions`), which
# Dependabot creates in the repository when it is missing, outside the type:/area: scheme.
version: 2
updates:
  # Python, through poetry.lock. lockfile-only: Dependabot moves what the lock file records
  # within the ranges of pyproject.toml, and never a floor or a cap, so a major of a
  # dependency is taken on a branch, by hand.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    labels: ["dependencies"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
