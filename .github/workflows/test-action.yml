name: Test Action

on:
  pull_request:
    branches:
      - main
      - dev
      - test/add-end-to-end-integration-tests-for-the-github-action # todo: remove this branch after the PR is merged
permissions:
  contents: write
  pull-requests: write

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run jPipe Runner Action
        uses: ./
        with:
          working_directory: 'tests/action/resources/simple_success'
          jd_file: 'file_validation.json'
          library: 'file_validation.py'
          config-file: 'config.yaml'
          github-token: ${{ secrets.GITHUB_TOKEN }}
