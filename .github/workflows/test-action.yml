name: Test Action

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - dev
permissions:
  contents: write
  pull-requests: write

jobs:
  test-simple-success:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/test-template.yml
    with:
      working_directory: 'tests/action/resources/simple_success'
      jd_file: 'file_validation.json'
      library: 'file_validation.py'
      config-file: 'config.yaml'
      expected_result: '0'
    secrets: inherit

  test-raise-exception:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/test-template.yml
    with:
      working_directory: 'tests/action/resources/raise_exception'
      jd_file: 'raise_exception.json'
      library: 'raise_exception.py'
      expected_result: '1'
    secrets: inherit
