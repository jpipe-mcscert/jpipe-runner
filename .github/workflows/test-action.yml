name: Test Action

# ---------------------------------------------------------------------------
# Test Action – workflow that runs jpipe-runner in a PR context
#
# What this does:
#   Triggers on PR, runs the jpipe-runner action with different test
#   scenarios.
#
# This serves as an end-to-end test of the action in a real PR context, including
# posting PR comments.
# ---------------------------------------------------------------------------

on:
  pull_request:
    # We don't want to run these tests on every push to the PR, only when it is opened or updated, to save CI resources.
    # If the PR is in draft mode, we skip the tests. When the PR is ready for review, we run the tests.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - dev
permissions:
  contents: write
  pull-requests: write

jobs:
  # -----------------------------------------------------------------------
  # Simple success scenario
  # -----------------------------------------------------------------------
  test-simple-success:
    # We skip the tests if the PR is in draft mode, to save CI resources. Once the PR is ready for review, the tests will run.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run jpipe-runner action
        id: run_jpipe
        uses: ./
        continue-on-error: true
        with:
          working_directory: 'tests/action/resources/simple_success'
          jd_file: 'file_validation.json'
          library: 'file_validation.py'
          config-file: 'config.yaml'
          github-token: ${{ github.token }}

      - name: Check expected result
        uses: ./.github/actions/check-expected-result
        with:
          result: ${{ steps.run_jpipe.outputs.result }}
          expected_result: '0'

  # -----------------------------------------------------------------------
  # Exception scenario
  # -----------------------------------------------------------------------
  # A justification where the strategy element raises an exception.
  # The pipeline should fail (exit 1). We then fetch the PR comment that
  # was posted by jpipe-runner and check that the exception message is
  # visible in the comment.
  test-raise-exception:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run jpipe-runner action
        id: run_jpipe
        uses: ./
        continue-on-error: true
        with:
          working_directory: 'tests/action/resources/raise_exception'
          jd_file: 'raise_exception.json'
          library: 'raise_exception.py'
          github-token: ${{ github.token }}

      - name: Check expected result
        uses: ./.github/actions/check-expected-result
        with:
          result: ${{ steps.run_jpipe.outputs.result }}
          expected_result: '1'

      - name: Fetch PR comment by ID
        id: fetch_comment
        uses: ./.github/actions/fetch-pr-comment
        with:
          comment_id: ${{ steps.run_jpipe.outputs.pr_comment_id }}
          github-token: ${{ github.token }}

      - name: Verify PR comment content
        shell: bash
        env:
          PR_COMMENT: ${{ steps.fetch_comment.outputs.pr_comment }}
        run: |
          expected_msg="This is an intentional exception raised by the test to verify that the action correctly adds the error message to the PR comment."

          if echo "$PR_COMMENT" | grep -qF "$expected_msg"; then
            echo "SUCCESS: PR comment contains the expected exception message"
          else
            echo "ERROR: PR comment does not contain the expected exception message"
            echo "--- PR comment content ---"
            echo "$PR_COMMENT"
            echo "--------------------------"
            exit 1
          fi