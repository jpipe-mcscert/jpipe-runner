name: Update Homebrew Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 3.4.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  update-homebrew-formula:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Add Poetry to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-root

      - name: Download source tarball from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          gh release download "$TAG" --pattern "*.tar.gz" --dir dist/
          FILE=$(ls dist/*.tar.gz)
          SHA=$(shasum -a 256 "$FILE" | cut -d " " -f 1)
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          echo "SHA256=$SHA" >> $GITHUB_ENV
          echo "SOURCE_FILE=$FILE" >> $GITHUB_ENV

      - name: Generate formula
        run: |
          export CLASS_NAME="JpipeRunner"
          export HOMEPAGE_URL="https://github.com/jpipe-mcscert/jpipe-runner"
          export SOURCE_URL="https://github.com/jpipe-mcscert/jpipe-runner/releases/download/${TAG}/$(basename ${SOURCE_FILE})"
          export SOURCE_SHA256="${SHA256}"
          export PYTHON_VERSION="${{ env.PYTHON_VERSION }}"
          mkdir -p tap/Formula

          RESOURCES="$(bash script/generate_formula_resources.sh)"
          if [[ -z "$RESOURCES" ]]; then
            echo "ERROR: resource generation produced no output" >&2
            exit 1
          fi
          export RESOURCES
          envsubst < Formula/homebrew_formula_template.rb > tap/Formula/jpipe-runner.rb

          export FORMATTED_VERSION=$(echo "$VERSION" | sed 's/\.//g')
          export CLASS_NAME="${CLASS_NAME}AT${FORMATTED_VERSION}"
          envsubst < Formula/homebrew_formula_template.rb > tap/Formula/jpipe-runner@${VERSION}.rb

      - name: Publish to Homebrew tap
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_PAT }}@github.com/jpipe-mcscert/homebrew-mcscert.git tap-repo
          cp tap/Formula/jpipe-runner.rb tap-repo/
          cp tap/Formula/jpipe-runner@${VERSION}.rb tap-repo/
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jpipe-runner.rb jpipe-runner@${VERSION}.rb
          git commit -m "Update jpipe-runner formula to version ${VERSION}"
          git push origin main
