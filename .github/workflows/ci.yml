name: ci.yml

env:
  PYTHON_VERSION: '3.11'
  HYPOTHESIS_PROFILE: ci   # derandomized: every run explores the same cases (tests/README.md)

on:
  # Every branch: milestone branches get CI before their pull request is opened (ADR-0014).
  push:
    branches-ignore:
      - jpipe-runner-diagrams   # the Action's image output branch, not code
  # Pull requests from forks, which do not trigger `push` here. A same-repository pull
  # request (every milestone has one, as a draft, ADR-0015) is already covered by `push`,
  # so the jobs skip it rather than run twice per commit.
  pull_request:
    branches:
      - main

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint (ruff)
        run: poetry run ruff check --output-format=github .
      - name: Check formatting (ruff)
        run: poetry run ruff format --check .
      - name: Type-check (mypy --strict)
        run: poetry run mypy

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run tests
        run: poetry run pytest
