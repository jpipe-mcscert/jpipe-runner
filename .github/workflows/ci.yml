name: ci.yml

env:
  PYTHON_VERSION: '3.11'
  HYPOTHESIS_PROFILE: ci   # derandomized: every run explores the same cases (tests/README.md)

on:
  # Every branch: milestone branches get CI before their pull request is opened (ADR-0014).
  push:
    branches-ignore:
      - jpipe-runner-diagrams   # where the v3 Action's tests committed images, not code
  # Pull requests from forks, which do not trigger `push` here. A same-repository pull
  # request (every milestone has one, as a draft, ADR-0015) is already covered by `push`,
  # so the jobs skip it rather than run twice per commit.
  pull_request:
    branches:
      - main

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint (ruff)
        run: poetry run ruff check --output-format=github .
      - name: Check formatting (ruff)
        run: poetry run ruff format --check .
      - name: Type-check (mypy --strict)
        run: poetry run mypy

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run tests
        run: poetry run pytest

  # The suite on the floor of each runtime dependency, the oldest version a supported
  # channel installs, on the Python Ubuntu noble ships (ADR-0026). `test` covers the other
  # end of each range, with what poetry.lock records.
  test-floor:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
      - name: Install the floor of each runtime dependency
        run: |
          poetry run python -m tests.floors > "$RUNNER_TEMP/floors.txt"
          cat "$RUNNER_TEMP/floors.txt"
          poetry run pip install --quiet -r "$RUNNER_TEMP/floors.txt"
      - name: Run tests
        run: poetry run pytest --no-cov
