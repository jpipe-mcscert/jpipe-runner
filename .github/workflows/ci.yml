name: ci.yml

env:
  PYTHON_VERSION: '3.11'
  HYPOTHESIS_PROFILE: ci   # derandomized: every run explores the same cases (tests/README.md)

on:
  # Every branch: a work branch gets CI from its first push, before its pull request.
  # Branches only: a release tag is tested by release.yml, not here a second time.
  push:
    branches:
      - '**'
  # Pull requests from forks, which do not trigger `push` here. A same-repository pull
  # request is already covered by `push`, so the jobs skip it rather than run twice per
  # commit.
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint (ruff)
        run: poetry run ruff check --output-format=github .
      - name: Check formatting (ruff)
        run: poetry run ruff format --check .
      - name: Type-check (mypy --strict)
        run: poetry run mypy

  # The suite on every Python from the floor to the latest, with what poetry.lock records:
  # 3.11 (Homebrew's), 3.12 (Ubuntu noble's, which test-floor also runs on the oldest
  # dependencies), 3.13, 3.14 (Ubuntu resolute's and stonking's) and 3.15. Python changes
  # what the runner reads of a step (its bytecode, ADR-0037) and how it names a value's type
  # in the report.
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    name: test (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: poetry run pytest

  # The suite on the floor of each runtime dependency, the oldest version a supported
  # channel installs, on the Python Ubuntu noble ships (ADR-0026). `test` covers the other
  # end of each range, with what poetry.lock records.
  test-floor:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.12'
      - name: Install the floor of each runtime dependency
        run: |
          poetry run python -m tests.floors > "$RUNNER_TEMP/floors.txt"
          cat "$RUNNER_TEMP/floors.txt"
          poetry run pip install --quiet -r "$RUNNER_TEMP/floors.txt"
      - name: Run tests
        run: poetry run pytest --no-cov
