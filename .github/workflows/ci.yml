name: ci.yml

env:
  PYTHON_VERSION: '3.11'

on:
  # Every branch: milestone branches get CI before their pull request is opened (ADR-0014).
  push:
    branches-ignore:
      - jpipe-runner-diagrams   # the Action's image output branch, not code
  # Pull requests from forks, which do not trigger `push` here.
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint (ruff)
        run: poetry run ruff check --output-format=github .
      - name: Check formatting (ruff)
        run: poetry run ruff format --check .
      - name: Type-check (mypy --strict)
        run: poetry run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run tests
        run: poetry run pytest
