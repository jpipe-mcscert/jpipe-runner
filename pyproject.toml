[tool.poetry]
name = "jpipe-runner"
version = "3.5.2"
description = "A Justification Runner designed for jPipe."
authors = [
    "Jason Lyu <xjasonlyu@gmail.com>",
    "Sébastien Mosser <mossers@mcmaster.ca>",
    "Baptiste Lacroix <contact@baptiste-lacroix.fr>"
]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/jpipe-mcscert/jpipe-runner"
keywords = ["justification", "pipeline", "ML", "AI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
packages = [
    { include = "jpipe_runner", from = "src" },
    { include = "jpipe_runner/schema", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11"
networkx = "3.5"
graphviz = ">=0.20"
pyyaml = "6.0.2"
jsonschema = ">=4.0"

sphinx = { version = "8.1.3", optional = true }

[tool.poetry.extras]
docs = ["sphinx"]
full = ["sphinx"]

[tool.poetry.scripts]
jpipe-runner = "jpipe_runner.runner:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-mock = "^3.14.1"
pytest-cov = "^6.1"
ruff = "^0.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line length enforced by ruff format, not lint
    "F821",   # forward-reference string annotations (e.g. "PipelineEngine")
]

[tool.ruff.lint.per-file-ignores]
"src/jpipe_runner/runner.py" = ["W291", "W293"]  # intentional trailing spaces in ASCII art

[tool.coverage.run]
source = ["src/jpipe_runner"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
