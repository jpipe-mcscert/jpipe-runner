[tool.poetry]
name = "jpipe-runner"
version = "4.0.0.dev0"
description = "A Justification Runner designed for jPipe."
authors = [
    "Jason Lyu <xjasonlyu@gmail.com>",
    "Sébastien Mosser <mossers@mcmaster.ca>",
    "Baptiste Lacroix <contact@baptiste-lacroix.fr>",
    "Corentin Veillard <corentin.veillard@etu.univ-cotedazur.fr>",
]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/jpipe-mcscert/jpipe-runner"
keywords = ["justification", "pipeline", "ML", "AI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
packages = [
    { include = "jpipe_runner", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11"
networkx = "3.5"
graphviz = ">=0.20"
pyyaml = "6.0.2"
jsonschema = ">=4.0"

[tool.poetry.scripts]
jpipe-runner = "jpipe_runner.runner:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-cov = "^7.1"
hypothesis = "^6.168"
ruff = "^0.16"
mypy = "^2.4"
types-networkx = "~3.5"
types-jsonschema = "^4.26.0.20260518"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# The setuptools shim the Debian build uses; carried over from v3 as is (#107).
extend-exclude = ["setup.py"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "PT",      # flake8-pytest-style
    "RUF",     # ruff-specific
]
ignore = [
    "E501",    # line length is enforced by ruff format, not lint
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# `unit` and `e2e` are applied by tests/conftest.py from the test's directory;
# a test file outside tests/unit/ or tests/e2e/ is a collection error.
markers = [
    "unit: fast, in-process tests (tests/unit/)",
    "e2e: end-to-end tests that run whole scenarios (tests/e2e/)",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
xfail_strict = true

[tool.coverage.run]
source = ["jpipe_runner"]
branch = true
# coverage.xml is consumed by SonarCloud, which needs paths relative to the repository.
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
