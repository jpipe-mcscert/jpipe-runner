# SonarQube Cloud analysis for jpipe-runner: identity and scope only. The workflow that runs
# the scan and waits for the quality gate is .github/workflows/sonar.yml. See ADR-0004.

sonar.projectKey=jpipe-mcscert_jpipe-runner
sonar.organization=jpipe-mcscert
sonar.projectName=jpipe-runner

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Naming the roots keeps the packaging and release plumbing (setup.py, debian/, script/,
# Formula/, the root action.yml) out of scope without any exclusion list.
sonar.sources=src
sonar.tests=tests

# Written by `pytest` (see addopts and [tool.coverage] in pyproject.toml), which the workflow
# runs immediately before the scan. Paths in it are repository-relative (`relative_files`).
sonar.python.coverage.reportPaths=coverage.xml
