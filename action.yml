name: "jPipe Runner"
description: "GitHub Action to run justification diagrams of jpipe"
author: "Jason Lyu, Baptiste Lacroix, Sébastien Mosser"
branding:
  icon: "user-check"
  color: "red"

inputs:
  jd_file:
    description: "Path to the justification .jd.json file"
    required: true
  variable:
    description: "Define one or more variables in the format NAME:VALUE, separated by newlines"
    required: false
  config-file:
    description: "Path to the configuration file for jPipe Runner (yaml)"
    required: false
  library:
    description: "Specify one or more Python libraries to load, separated by newlines"
    required: true
  diagram:
    description: "Specify diagram pattern or wildcard"
    required: false
    default: "*"
  format:
    description: "Output format for the diagram, e.g. 'dot', 'gif', 'jpeg', 'jpg', 'pdf', 'png', 'svg'. Default is 'svg'"
    required: false
    default: "svg"
  dry_run:
    description: "Perform a dry run without actually executing justifications"
    required: false
    default: "false"
  python_exec_path:
    description: "Specify a Python interpreter path to run jPipe Runner"
    required: false
    default: ""
  python_path:
    description: "Specify one or more extra folders to search for Python files/modules, separated by newlines"
    required: false
  working_directory:
    description: "Specify a working directory to run jPipe Runner"
    required: false
    default: "."
  version:
    description: "jPipe Runner git ref to install: a tag (e.g. 'v3.5.3'), a branch, or a commit SHA. Installed from git, so this is NOT a PyPI version. Defaults to the main branch"
    required: false
    default: "main"
  embed_image:
    description: "If true, embed diagram in PR comment otherwise only upload as artifact"
    required: false
    default: "false"
  image_branch:
    description: "Branch name where the image will be committed"
    required: false
    default: "jpipe-runner-diagrams"
  image_repo:
    description: "Target repo (owner/repo) for committing the image; defaults to current repo"
    required: false
    default: ""
  image_path:
    description: "Path where image will be stored in the branch"
    required: false
    default: "diagrams/"
  image_commit_message:
    description: "Commit message for the generated diagram"
    required: false
    default: "Add generated diagram from jPipe Runner"
  github-token:
    description: "GitHub token to authenticate (Read & Write access to actions, code, pull requests, and metadata)"
    required: false
  github-readonly-token:
    description: "GitHub read permission only token to generate the raw URL of the image for accessing URLs in private repositories (Read access to actions, code, and metadata)"
    required: false

outputs:
  result:
    description: "Exit code of the jPipe Runner execution"
    value: ${{ steps.run_jpipe.outputs.result }}
  diagram_path:
    description: "Path to the generated diagram artifact"
    value: ${{ steps.run_jpipe.outputs.diagram_path }}
  pr_comment_id:
    description: "ID of the PR comment posted"
    value: ${{ steps.post_pr_comment.outputs.comment_id }}

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        echo "::group::Install system dependencies"
        # Only the `dot` binary is needed; most GitHub-hosted runner images already
        # ship it, so skip apt entirely when it is present.
        #
        # When apt IS needed, keep it quiet: -qq silences `apt-get update`, but it does
        # NOT silence dpkg's unpack/"Setting up" chatter during install (~287 lines for
        # graphviz), so stdout is redirected too. stderr is deliberately left alone, so
        # a genuine failure still prints (e.g. "E: Unable to locate package") and the
        # non-zero exit still fails the step.
        if command -v dot >/dev/null 2>&1; then
          echo "graphviz already available ($(dot -V 2>&1)); skipping apt."
        else
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq graphviz >/dev/null
          echo "graphviz installed."
        fi
        echo "::endgroup::"

    - name: Set up Python
      if: ${{ !inputs.python_exec_path }}
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install jpipe-runner
      shell: bash
      env:
        PYTHON_EXEC_PATH: ${{ inputs.python_exec_path || 'python' }}
        VERSION: ${{ inputs.version }}
      run: |
        echo "::group::Install jPipe Runner"
        ${{ github.action_path }}/script/action/install_jpipe_runner.sh
        echo "::endgroup::"

    - name: Run jPipe Runner
      id: run_jpipe
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        PYTHON_EXEC_PATH: ${{ inputs.python_exec_path || 'python' }}
        PYTHON_PATH: ${{ inputs.python_path }}
        JD_FILE: ${{ inputs.jd_file }}
        VARIABLE: ${{ inputs.variable }}
        LIBRARY: ${{ inputs.library }}
        CONFIG_FILE: ${{ inputs.config-file }}
        DIAGRAM: ${{ inputs.diagram }}
        DRY_RUN: ${{ inputs.dry_run }}
        FORMAT: ${{ inputs.format }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        echo "::group::Run jPipe Runner"
        ${{ github.action_path }}/script/action/run_jpipe.sh
        echo "::endgroup::"

    - name: Upload diagram as artifact
      id: upload_diagram
      # Skip when the runner produced no diagram: run_jpipe.sh exits early without
      # setting diagram_path, and archive:false fails hard unless the path resolves
      # to exactly one file.
      if: always() && steps.run_jpipe.outputs.diagram_path != ''
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.run_jpipe.outputs.diagram_path }}
        # Upload the diagram unzipped so the download is the image itself.
        # `name:` is intentionally omitted — it is ignored when archive is false;
        # the artifact takes the file's own name, which already equals diagram_name.
        archive: false

    - name: Commit diagram to branch
      if: ${{ inputs.embed_image == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IMAGE_FILE: ${{ steps.run_jpipe.outputs.diagram_path }}
        IMAGE_NAME: ${{ steps.run_jpipe.outputs.diagram_name }}
        IMAGE_REPO: ${{ inputs.image_repo }}
        IMAGE_BRANCH: ${{ inputs.image_branch }}
        IMAGE_PATH: ${{ inputs.image_path }}
        IMAGE_COMMIT_MESSAGE: ${{ inputs.image_commit_message }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        echo "::group::Commit diagram to branch"
        ${{ github.action_path }}/script/action/commit_diagram.sh
        echo "::endgroup::"

    - name: Build comment message
      if: always()
      id: comment_content
      shell: bash
      env:
        RESULT: ${{ steps.run_jpipe.outputs.result }}
        EMBED_IMAGE: ${{ inputs.embed_image }}
        ARTIFACT_URL: ${{ steps.upload_diagram.outputs.artifact-url }}
        IMAGE_REPO: ${{ inputs.image_repo }}
        IMAGE_PATH: ${{ inputs.image_path }}
        IMAGE_BRANCH: ${{ inputs.image_branch }}
        DIAGRAM_NAME: ${{ steps.run_jpipe.outputs.diagram_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        RUNNER_OUTPUT: ${{ steps.run_jpipe.outputs.runner_output }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_READONLY_TOKEN: ${{ inputs.github-readonly-token }}
      run: |
        echo "::group::Build comment message"
        ${{ github.action_path }}/script/action/build_comment.sh
        echo "::endgroup::"

    - name: Post PR comment
      if: always()
      id: post_pr_comment
      uses: actions/github-script@v9
      env:
        PR_COMMENT_MESSAGE: ${{ steps.comment_content.outputs.msg }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // Replace newlines in the message with actual newlines
          const message = process.env.PR_COMMENT_MESSAGE.replace(/\\n/g, '\n');
          
          // Check if the workflow was triggered by a pull request
          if (!context.issue || !context.issue.number) {
              console.log("This action was not triggered by a pull request, skipping comment.");
              core.setOutput("comment_id", "");
              return { id: null };
          }
          
          const response = await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: message
          });
          
          // Capture the comment ID
          core.setOutput("comment_id", response.data.id.toString());
          return response.data;

    - name: Fail if jPipe Runner failed
      if: ${{ steps.run_jpipe.outputs.result != '0' }}
      shell: bash
      run: exit ${{ steps.run_jpipe.outputs.result }}
